<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 議事録 & ノート</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      padding: 0 24px;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #161b22;
    }
    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #6e7681;
      border-radius: 50%;
      transition: all 0.3s;
    }
    .status-dot.active { background-color: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .status-dot.paused { background-color: #e3b341; box-shadow: 0 0 8px #e3b341; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button.primary { background: #0284c7; border-color: #38bdf8; color: #ffffff; }
    button.primary:hover { background: #0369a1; }
    button.danger { background: #da3633; border-color: #f85149; color: #ffffff; }
    button.danger:hover { background: #b62324; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    main {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr;
      gap: 16px; padding: 16px; height: calc(100vh - 56px);
    }
    .panel {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px; border-bottom: 1px solid #30363d;
      font-size: 13px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-body {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .summary-card {
      background: #0d1117; border: 1px solid #0284c7; border-radius: 6px; padding: 12px 16px;
    }
    .summary-title { font-size: 12px; color: #38bdf8; font-weight: 600; margin-bottom: 6px; }
    .summary-text { font-size: 13px; line-height: 1.5; color: #e6edf3; }
    .transcript-log { flex: 1; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .log-item { font-size: 14px; line-height: 1.6; border-left: 2px solid #30363d; padding-left: 12px; }
    .log-time { font-size: 11px; color: #6e7681; margin-bottom: 2px; }
    .canvas-container {
      flex: 1; position: relative; background: #0d1117; border-radius: 6px; border: 1px dashed #30363d;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
    .stamp-bar { display: flex; gap: 8px; }
    .stamp-btn { padding: 6px 12px; font-size: 12px; background: #0d1117; }
    .interim-text { color: #8b949e; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">STANDBY</span>
    </div>
    <div class="controls">
      <button class="primary" id="startBtn">▶ 開始</button>
      <button id="pauseBtn" disabled>⏸ 一時停止</button>
      <button class="danger" id="stopBtn" disabled>■ 終了 (完了)</button>
      <button id="clearCanvasBtn">手書き消去</button>
    </div>
  </header>

  <main>
    <!-- 左パネル：文字起こし / 進行要約 / AIファシリテーター -->
    <section class="panel">
      <div class="panel-header">
        <span>文字起こし & AIサポート</span>
        <span id="recTag" style="color: #6e7681; font-weight: normal;">OFF</span>
      </div>
      <div class="panel-body">
        <div class="summary-card">
          <div class="summary-title">⚡ リアルタイム進行要約 (1分自動バックアップ)</div>
          <div class="summary-text" id="liveSummary">
            「開始」を押すと音声認識と自動バックアップが開始されます。
          </div>
        </div>

        <div class="summary-card" style="border-color: #38bdf8; background-color: #161b22;">
          <div class="summary-title" style="color: #38bdf8;">🤖 AIファシリテーター (タイムキーパー)</div>
          <div class="summary-text" id="aiAdviceText">会議の進行状態を監視しています...</div>
        </div>

        <div class="transcript-log" id="transcriptLog"></div>
      </div>
    </section>

    <!-- 右パネル：手書きメモ ＆ スタンプ -->
    <section class="panel">
      <div class="panel-header">
        <span>手書きメモ & スタンプ</span>
        <div class="stamp-bar">
          <button class="stamp-btn" onclick="addStamp('【重要】')">【重要】</button>
          <button class="stamp-btn" onclick="addStamp('【課題】')">【課題】</button>
          <button class="stamp-btn" onclick="addStamp('【決定】')">【決定】</button>
        </div>
      </div>
      <div class="panel-body" style="padding: 12px;">
        <div class="canvas-container">
          <canvas id="handwritingCanvas"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ★ GASデプロイ時に発行されたウェブアプリURLに書き換えてください
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzwln60UCKH7t5sWVSaPnR-Uc7uzoU7ekIeMNCV21iWFZ9xIOOUB-AQfodGK4x87n7ETA/exec";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let isPaused = false;
   
    let activeDocId = null;
    let activeDocUrl = null;
    let unsavedLogs = [];
    let autoSaveTimer = null;
    let elapsedMinutes = 0;
    let aiTimer = null;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const recTag = document.getElementById('recTag');
    const liveSummary = document.getElementById('liveSummary');
    const aiAdviceText = document.getElementById('aiAdviceText');
    const transcriptLog = document.getElementById('transcriptLog');

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let currentInterimEl = null;

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        if (finalTranscript) {
          if (currentInterimEl) {
            currentInterimEl.remove();
            currentInterimEl = null;
          }
          addTranscriptLog(finalTranscript);
        } else if (interimTranscript) {
          if (!currentInterimEl) {
            currentInterimEl = document.createElement('div');
            currentInterimEl.className = 'log-item interim-text';
            transcriptLog.appendChild(currentInterimEl);
          }
          currentInterimEl.innerText = interimTranscript;
          transcriptLog.parentElement.scrollTop = transcriptLog.parentElement.scrollHeight;
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech Recognition Error:', event.error);
        if (event.error === 'not-allowed') {
          alert('マイクの使用が拒否されています。ブラウザの設定でマイクを許可してください。');
          resetUI();
        }
      };

      recognition.onend = () => {
        if (isRecording && !isPaused) {
          try {
            recognition.start();
          } catch (e) {
            console.log('再起動待機中...', e);
          }
        }
      };
    } else {
      alert('お使いのブラウザは音声認識に対応していません。');
    }

    // 「開始」ボタン
    startBtn.addEventListener('click', async () => {
      if (!SpeechRecognition) return;

      startBtn.disabled = true;
      statusText.innerText = 'ドキュメント作成中...';

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'initDoc' })
        });
        const res = await response.json();

        if (res.success) {
          activeDocId = res.docId;
          activeDocUrl = res.url;

          isRecording = true;
          isPaused = false;
          
          try {
            recognition.start();
          } catch(e) {
            console.log(e);
          }

          pauseBtn.disabled = false;
          stopBtn.disabled = false;

          statusDot.className = 'status-dot active';
          statusText.innerText = 'LIVE RECORDING';
          recTag.innerText = 'REC';
          recTag.style.color = '#38bdf8';

          liveSummary.innerText = '録音および自動書き出し（AIマスキング対応）を開始しました。';
          aiAdviceText.innerText = '💡 会議スタート: アジェンダに沿って進行しましょう。';

          if (autoSaveTimer) clearInterval(autoSaveTimer);
          autoSaveTimer = setInterval(performAutoSave, 60000);
          startFacilitatorTimer();
        } else {
          alert('初期化に失敗しました: ' + res.error);
          resetUI();
        }
      } catch (err) {
        alert('通信エラーが発生しました: ' + err.message);
        resetUI();
      }
    });

    function resetUI() {
      isRecording = false;
      isPaused = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      statusDot.className = 'status-dot';
      statusText.innerText = 'STANDBY';
      recTag.innerText = 'OFF';
      recTag.style.color = '#6e7681';
    }

    // 「一時停止」ボタン
    pauseBtn.addEventListener('click', () => {
      if (!isRecording) return;

      if (!isPaused) {
        isPaused = true;
        recognition.stop();
        pauseBtn.innerText = '▶ 再開';
        statusDot.className = 'status-dot paused';
        statusText.innerText = 'PAUSED';
        recTag.innerText = 'PAUSE';
        recTag.style.color = '#e3b341';
        aiAdviceText.innerText = '⏸ 一時停止中: 再開されるまで監視をストップします。';
      } else {
        isPaused = false;
        try {
          recognition.start();
        } catch(e) {}
        pauseBtn.innerText = '⏸ 一時停止';
        statusDot.className = 'status-dot active';
        statusText.innerText = 'LIVE RECORDING';
        recTag.innerText = 'REC';
        recTag.style.color = '#38bdf8';
        aiAdviceText.innerText = '▶ 再開しました。';
      }
    });

    // 「終了」ボタン
    stopBtn.addEventListener('click', () => {
      if (confirm('録音を終了します。残りの差分データを保存して完了しますか？')) {
        isRecording = false;
        isPaused = false;
        if (recognition) recognition.stop();
        if (autoSaveTimer) clearInterval(autoSaveTimer);
        if (aiTimer) clearInterval(aiTimer);

        statusText.innerText = '最終保存中...';

        performAutoSave(() => {
          resetUI();
          pauseBtn.innerText = '⏸ 一時停止';
          aiAdviceText.innerText = '✅ 会議終了: ドキュメントへの書き出しが完了しました。';
          alert('保存が完了しました！\nGoogleドキュメントを開きます。');
          if (activeDocUrl) window.open(activeDocUrl, '_blank');
        });
      }
    });

    function addTranscriptLog(text) {
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      const formattedText = `[${timeStr}] ${text}`;

      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<div class="log-time">${timeStr}</div><div class="log-content">${text}</div>`;
      transcriptLog.appendChild(item);

      unsavedLogs.push(formattedText);
      transcriptLog.parentElement.scrollTop = transcriptLog.parentElement.scrollHeight;
    }

    // 自動保存処理
    async function performAutoSave(callback) {
      if (!activeDocId || unsavedLogs.length === 0) {
        if (callback) callback();
        return;
      }

      const sendBatch = [...unsavedLogs];
      unsavedLogs = [];

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'autoSave',
            docId: activeDocId,
            newTextList: sendBatch,
            currentSummary: liveSummary.innerText
          })
        });
        const res = await response.json();

        if (res.success) {
          liveSummary.innerText = res.summary;
        } else {
          unsavedLogs = [...sendBatch, ...unsavedLogs];
        }
      } catch (err) {
        unsavedLogs = [...sendBatch, ...unsavedLogs];
      }

      if (callback) callback();
    }

    // AIファシリテーター・タイマーロジック
    function startFacilitatorTimer() {
      elapsedMinutes = 0;
      if (aiTimer) clearInterval(aiTimer);
      aiTimer = setInterval(() => {
        if (!isPaused && isRecording) {
          elapsedMinutes++;
          updateAiAdvice();
        }
      }, 60000);
    }

    function updateAiAdvice() {
      const logCount = document.querySelectorAll('.log-content').length;

      if (elapsedMinutes === 15) {
        aiAdviceText.innerText = "💡 15分経過: 議題1の進捗はいかがですか？次のアジェンダ確認に移りましょう。";
      } else if (elapsedMinutes === 30) {
        aiAdviceText.innerText = "💡 30分経過: 折り返し地点です。議論が脱線している場合はアジェンダへ戻しましょう。";
      } else if (elapsedMinutes === 45) {
        aiAdviceText.innerText = "⚠️ 45分経過: 終盤です。決定事項の確認とTo-Doの整理へ移行してください。";
      } else if (logCount > 0 && logCount % 20 === 0) {
        aiAdviceText.innerText = "💬 発言が多く出ています。重要な決定があれば【決定】スタンプを押しておきましょう。";
      }
    }

    // 手書きキャンバス処理
    const canvas = document.getElementById('handwritingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startDrawing(e) { isDrawing = true; draw(e); }
    function stopDrawing() { isDrawing = false; ctx.beginPath(); }
    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', draw);

    document.getElementById('clearCanvasBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    function addStamp(tag) {
      addTranscriptLog(`【スタンプ】${tag}`);
    }
  </script>
</body>
</html>
